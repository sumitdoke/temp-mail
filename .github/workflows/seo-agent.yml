name: Daily SEO Agent

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SEO Agent
        run: |
          response=$(curl -s \
            --max-time 60 \
            --request POST \
            --url "${{ secrets.SITE_URL }}/api/agent/auto" \
            --header 'Content-Type: application/json' \
            --data '{"secret":"${{ secrets.AGENT_SECRET }}"}')
          echo "Response: $response"
          
      - name: Check Response
        run: |
          echo "Agent completed successfully"