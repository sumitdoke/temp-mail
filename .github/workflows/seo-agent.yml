name: Daily SEO Agent

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SEO Agent
        run: |
          response=$(curl -s -X POST \
          ${{ secrets.SITE_URL }}/api/agent/auto \
          -H "Content-Type: application/json" \
          -d '{"secret": "${{ secrets.AGENT_SECRET }}"}')
          echo "Agent Response: $response"