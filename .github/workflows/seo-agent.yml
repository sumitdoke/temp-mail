name: Daily SEO Agent

on:
  schedule:
    # 7:30 PM IST (Best India + USA overlap)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-seo-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger SEO Agent
        id: trigger
        run: |
          echo "🚀 Starting SEO Agent..."

          response=$(curl -s -L \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            --url "${{ secrets.SITE_URL }}/api/agent/auto" \
            --header 'Content-Type: application/json' \
            --data "{\"secret\":\"${{ secrets.AGENT_SECRET }}\"}")

          echo "Response: $response"

          # Save response for next step
          echo "$response" > response.json

      - name: Validate Response
        run: |
          echo "🔍 Checking response..."

          # Check success safely
          if grep -q '"success":true' response.json; then
            echo "✅ Agent executed successfully!"
          else
            echo "❌ Agent failed!"
            cat response.json
            exit 1
          fi

      - name: Completed
        run: echo "🎯 SEO Agent cycle completed!"